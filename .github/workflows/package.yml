name: Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y cmake build-essential
      - run: cmake -S . -B _build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
      - run: cmake --build _build --parallel
      - run: ctest --test-dir _build --output-on-failure
      - run: cmake --build _build --target package
      - uses: actions/upload-artifact@v4
        with:
          name: solver-package
          path: |
            _build/*.tar.gz
            _build/*.deb
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            _build/*.tar.gz
            _build/*.deb
